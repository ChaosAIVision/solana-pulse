name: Pulse update

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect snapshot & regenerate reports
        run: python3 collect.py

      - name: Commit updated reports
        run: |
          git config user.name  "solana-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "pulse: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
